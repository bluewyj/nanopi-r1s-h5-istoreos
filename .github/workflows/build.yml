#
# 云端编译 iStoreOS —— 友善 NanoPi R1S H5 (Allwinner H5 / sunxi-cortexa53)
#
# 源码：https://github.com/bluewyj/istoreos  ·  分支 istoreos-24.10
# 产物：istoreos-*-sunxi-cortexa53-friendlyarm_nanopi-r1s-h5-{ext4,squashfs}-sdcard.img.gz
# 规格：370MiB（默认）与 20GiB 根分区两版并行
#
name: Build iStoreOS (NanoPi R1S H5)

on:
  workflow_dispatch:
    inputs:
      variant:
        description: '根分区规格'
        type: choice
        options:
          - both
          - 370m
          - 20g
        default: both
      ssh:
        description: '开启 SSH 调试会话 (true / false)'
        required: false
        default: 'false'
  schedule:
    # 每周一 04:00 (北京时间)
    - cron: '0 20 * * 0'
  push:
    branches: [ main, master ]
    paths:
      - 'configs/**'
      - 'files/**'
      - 'diy-part*.sh'
      - '.github/workflows/**'

env:
  REPO_URL: https://github.com/bluewyj/istoreos
  REPO_BRANCH: istoreos-24.10
  DIY_PART1: diy-part1.sh
  DIY_PART2: diy-part2.sh
  TZ: Asia/Shanghai
  # OpenWrt CONFIG_CCACHE 读此目录；加大以跨 run 复用（仓库缓存上限约 10GB）
  CCACHE_DIR: ${{ github.workspace }}/openwrt/.ccache
  CCACHE_MAXSIZE: 5G
  # GitHub Actions 默认 CI=true 会让 ccache 开 DEV_MODE/-Werror，与本地行为不一致
  # 参考：https://github.com/openwrt/openwrt/pull/20290
  CCACHE_DEV_MODE: 'OFF'
  BUILD_LOG: '1'

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          V="${{ github.event.inputs.variant }}"
          [ -z "$V" ] && V=both
          case "$V" in
            370m)
              echo 'matrix={"include":[{"id":"370m","config":"configs/nanopi-r1s-h5.config","partsize":"370","label":"370MiB"}]}' >> "$GITHUB_OUTPUT"
              ;;
            20g)
              echo 'matrix={"include":[{"id":"20g","config":"configs/nanopi-r1s-h5-20g.config","partsize":"20480","label":"20GiB"}]}' >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo 'matrix={"include":[{"id":"370m","config":"configs/nanopi-r1s-h5.config","partsize":"370","label":"370MiB"},{"id":"20g","config":"configs/nanopi-r1s-h5-20g.config","partsize":"20480","label":"20GiB"}]}' >> "$GITHUB_OUTPUT"
              ;;
          esac

  build:
    needs: prepare
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      # 必须在 checkout 之前；20g 同时打 squashfs+ext4（~20GiB 级镜像）需要大磁盘
      - name: 20g 最大化磁盘
        if: matrix.id == '20g'
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 4096
          swap-size-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: 检出本仓库
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        run: |
          echo "== 清理前 =="; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache /usr/local/share/boost \
                      /usr/share/swift /usr/lib/jvm "$AGENT_TOOLSDIRECTORY" || true
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile || true
          sudo apt-get clean
          if [ "${{ matrix.id }}" = "20g" ]; then
            sudo docker system prune -af || true
            sudo rm -rf /usr/local/share/powershell /usr/share/az_* /opt/microsoft \
                        /usr/local/graalvm /usr/local/.ghcup || true
          fi
          echo "== 清理后 =="; df -h /; df -h "$GITHUB_WORKSPACE" || true

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig \
            unzip zlib1g-dev file wget \
            ccache libelf-dev \
            python3 python3-dev python3-pyelftools \
            qemu-utils \
            libfuse-dev rename
          # ccache 目录在 clone 后才存在，此处仅确认命令可用
          ccache --version || true

      - name: 拉取 iStoreOS 源码
        run: |
          # depth=1 比完整历史快；Runner 在海外，勿走国内 git 代理
          git clone -b "$REPO_BRANCH" --depth 1 --single-branch "$REPO_URL" openwrt
          cd openwrt
          git log -1 --pretty=format:'%H %ad %s' --date=iso; echo
          {
            echo "SRC_COMMIT=$(git rev-parse --short HEAD)"
            echo "SRC_DATE=$(git log -1 --date=short --pretty=%ad)"
            # 工具链缓存键：tools/toolchain 变更才失效（命中可跳过约 30~60 分钟）
            echo "TOOLCHAIN_HASH=$(git log -1 --pretty=format:'%h' -- tools toolchain include/toolchain*.mk 2>/dev/null || git rev-parse --short HEAD)"
          } >> $GITHUB_ENV

          # Runner 在海外：去掉国内镜像（JSON 脚本改写，禁止 sed 删行留尾逗号）
          # Run#6：sed 弄坏 mirrors → tools/libdeflate 失败；Run#7：workflow 内嵌顶格 Python 再弄坏 YAML
          python3 "$GITHUB_WORKSPACE/scripts/fix-mirrors.py" scripts/projectsmirrors.json

      - name: 恢复工具链 + ccache 缓存
        id: cache-tc
        uses: actions/cache/restore@v4
        with:
          path: |
            openwrt/.ccache
            openwrt/staging_dir/host
            openwrt/staging_dir/hostpkg
            openwrt/staging_dir/toolchain-*
          # 矩阵两路共用前缀回落；save 键带 variant 避免同 run 冲突
          key: tc-sunxi-a53-${{ env.REPO_BRANCH }}-${{ env.TOOLCHAIN_HASH }}-${{ matrix.id }}-r${{ github.run_number }}
          restore-keys: |
            tc-sunxi-a53-${{ env.REPO_BRANCH }}-${{ env.TOOLCHAIN_HASH }}-
            tc-sunxi-a53-${{ env.REPO_BRANCH }}-

      - name: 命中缓存时标记工具链可跳过重编
        if: steps.cache-tc.outputs.cache-hit == 'true' || steps.cache-tc.outputs.cache-matched-key != ''
        working-directory: ./openwrt
        run: |
          if [ -d staging_dir ]; then
            find staging_dir -type d -name stamp -not -path '*target*' 2>/dev/null | while read -r DIR; do
              find "$DIR" -type f -exec touch {} + 2>/dev/null || true
            done
            mkdir -p tmp && echo "1" > tmp/.build
            echo "toolchain cache present; stamps refreshed"
            du -sh .ccache staging_dir/host staging_dir/toolchain-* 2>/dev/null || true
          else
            echo "cache key matched but staging_dir missing"
          fi
          mkdir -p .ccache
          ccache --max-size="$CCACHE_MAXSIZE" || true
          ccache -z || true

      - name: 自定义 feeds (diy-part1)
        run: |
          sed -i 's/\r$//' "$GITHUB_WORKSPACE/$DIY_PART1" "$GITHUB_WORKSPACE/$DIY_PART2" || true
          find "$GITHUB_WORKSPACE/files" -type f -exec sed -i 's/\r$//' {} + 2>/dev/null || true
          bash "$GITHUB_WORKSPACE/$DIY_PART1"

      - name: 更新并安装 feeds
        working-directory: ./openwrt
        run: |
          # 网络抖动可重试；失败则硬退出（避免半装 feeds 导致 silent drop）
          for i in 1 2 3; do
            ./scripts/feeds update -a && break
            echo "::warning::feeds update 失败，重试 $i/3"
            sleep $((i * 15))
            [ "$i" -eq 3 ] && exit 1
          done
          ./scripts/feeds install -a

      - name: 注入自定义文件 (diy-part2)
        run: bash "$GITHUB_WORKSPACE/$DIY_PART2"

      - name: 生成 .config 并校验
        working-directory: ./openwrt
        env:
          CONFIG_FILE: ${{ matrix.config }}
          EXPECT_PARTSIZE: ${{ matrix.partsize }}
        run: |
          cat $GITHUB_WORKSPACE/$CONFIG_FILE >> .config
          make defconfig
          echo "---------------- 关键配置校验 (${{ matrix.id }} / ${{ matrix.label }}) ----------------"
          grep -E 'CONFIG_TARGET_sunxi_cortexa53_DEVICE_friendlyarm_nanopi-r1s-h5=y' .config || true
          grep -E 'CONFIG_PACKAGE_luci-app-(store|quickstart|linkease|ddnsto|diskman|samba4)=y' .config || true
          grep -E 'CONFIG_PACKAGE_zram-swap=y' .config || true
          grep -E 'CONFIG_PACKAGE_dockerd=y' .config || true
          grep -E "CONFIG_TARGET_ROOTFS_PARTSIZE=${EXPECT_PARTSIZE}" .config || true
          # 硬性闸门：对齐官方 MT3000（512MB）核心包
          for k in \
            CONFIG_TARGET_sunxi_cortexa53_DEVICE_friendlyarm_nanopi-r1s-h5=y \
            CONFIG_PACKAGE_luci-app-store=y \
            CONFIG_PACKAGE_luci-app-quickstart=y \
            CONFIG_PACKAGE_luci-app-linkease=y \
            CONFIG_PACKAGE_luci-app-ddnsto=y \
            CONFIG_PACKAGE_luci-app-diskman=y \
            CONFIG_PACKAGE_luci-app-samba4=y \
            CONFIG_PACKAGE_zram-swap=y \
            CONFIG_PACKAGE_ddns-scripts=y \
            CONFIG_PACKAGE_kmod-usb-net-rtl8152=y \
            CONFIG_PACKAGE_r8152-firmware=y \
            CONFIG_PACKAGE_cifsmount=y \
            CONFIG_PACKAGE_blkid=y \
            CONFIG_PACKAGE_wget-ssl=y \
            CONFIG_PACKAGE_luci-ssl=y \
            "CONFIG_TARGET_ROOTFS_PARTSIZE=${EXPECT_PARTSIZE}"
          do
            grep -q "$k" .config || { echo "::error::关键配置 $k 未生效，请检查 $CONFIG_FILE 与 feeds"; exit 1; }
          done
          # seed 对照：仅硬校验目标/包/语言项（DEVEL/CCACHE 等构建选项允许缺省）
          DROPPED=0
          while IFS= read -r line || [ -n "$line" ]; do
            case "$line" in
              CONFIG_TARGET_*=y|CONFIG_PACKAGE_*=y|CONFIG_LUCI_*=y|CONFIG_KERNEL_*=y)
                if ! grep -q "^${line}$" .config; then
                  echo "::error::defconfig 丢弃配置: $line"
                  DROPPED=1
                fi
                ;;
              CONFIG_*=y)
                if ! grep -q "^${line}$" .config; then
                  echo "::warning::defconfig 丢弃非包配置(忽略): $line"
                fi
                ;;
            esac
          done < "$GITHUB_WORKSPACE/$CONFIG_FILE"
          if [ "$DROPPED" -ne 0 ]; then
            echo "::error::存在被 defconfig 静默丢弃的包/目标配置，请核对包名/feeds 后重编"
            exit 1
          fi
          echo "OK: seed 目标/包配置均保留"
          # 拒绝板载 WiFi；拒绝把 Docker 全量塞回（MT3000 官方也不带）
          if grep -q 'CONFIG_PACKAGE_kmod-rtl8189es=y' .config; then
            echo "::error::检测到 kmod-rtl8189es，本项目不集成板载 WiFi"
            exit 1
          fi
          if grep -q 'CONFIG_PACKAGE_dockerd=y' .config; then
            echo "::error::检测到 dockerd，当前应对齐 MT3000（无 Docker）"
            exit 1
          fi
          cp -f .config $GITHUB_WORKSPACE/output-config.seed

      - name: 下载软件源码包
        working-directory: ./openwrt
        run: |
          # make download 会先编少量 host 工具(libdeflate/zstd)；失败时清残包并 -j1 诊断
          mkdir -p .ccache dl
          for i in 1 2 3; do
            if make download -j$(nproc); then
              echo "OK: make download (attempt $i)"
              # 清掉明显损坏的小文件
              find dl -type f -size -1024c -print -delete 2>/dev/null || true
              exit 0
            fi
            echo "::warning::make download 失败，重试 $i/3（常见于 host 工具或残包）"
            find dl -type f -size -1024c -print -delete 2>/dev/null || true
            rm -rf build_dir/hostpkg build_dir/host/.libdeflate* staging_dir/host/stamp/.libdeflate* 2>/dev/null || true
            if [ "$i" -eq 2 ]; then
              echo "==> 单线程诊断 tools/libdeflate + tools/zstd =="
              make tools/libdeflate/compile tools/zstd/compile -j1 V=s || true
            fi
            sleep $((i * 15))
          done
          echo "::error::make download 三次均失败"
          exit 1

      - name: 编译固件（并行）
        id: compile
        continue-on-error: true
        working-directory: ./openwrt
        run: |
          set -o pipefail
          make -j$(nproc) 2>&1 | tee build.log
          echo "== 并行编译结束，产物目录： =="
          ls -lh bin/targets/sunxi/cortexa53/ || true

      - name: 并行失败时单线程重试
        if: steps.compile.outcome == 'failure'
        working-directory: ./openwrt
        run: |
          set -o pipefail
          make -j1 V=s 2>&1 | tee -a build.log

      - name: 保存工具链 + ccache（无论成败都保存，供下次命中）
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            openwrt/.ccache
            openwrt/staging_dir/host
            openwrt/staging_dir/hostpkg
            openwrt/staging_dir/toolchain-*
          key: tc-sunxi-a53-${{ env.REPO_BRANCH }}-${{ env.TOOLCHAIN_HASH }}-${{ matrix.id }}-r${{ github.run_number }}

      - name: 失败时上传编译日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-failure-${{ matrix.id }}-${{ github.run_number }}
          path: |
            openwrt/build.log
            openwrt/logs
          if-no-files-found: warn
          retention-days: 7

      - name: 整理产物并校验可刷镜像
        env:
          VARIANT_ID: ${{ matrix.id }}
          VARIANT_LABEL: ${{ matrix.label }}
        run: |
          mkdir -p $GITHUB_WORKSPACE/output
          cd openwrt/bin/targets/sunxi/cortexa53
          ls -lh
          # 必须有可写 TF 的 sdcard 镜像；仅有 initramfs 会导致“刷了不启动”
          SQUASH=$(ls -1 *nanopi-r1s-h5*squashfs-sdcard.img.gz 2>/dev/null | head -1 || true)
          EXT4=$(ls -1 *nanopi-r1s-h5*ext4-sdcard.img.gz 2>/dev/null | head -1 || true)
          if [ -z "$SQUASH" ]; then
            echo "::error::缺少 squashfs-sdcard.img.gz，无法保证 TF 刷机启动"
            ls -la || true
            exit 1
          fi
          SZ=$(stat -c%s "$SQUASH")
          if [ "$SZ" -lt 10485760 ]; then
            echo "::error::squashfs 镜像过小 (${SZ} bytes)，构建可能不完整"
            exit 1
          fi
          echo "OK squashfs: $SQUASH ($SZ bytes)"
          [ -n "$EXT4" ] && echo "OK ext4: $EXT4" || echo "WARN: 无 ext4 镜像（可仅用 squashfs）"
          cp -v *nanopi-r1s-h5*sdcard.img.gz $GITHUB_WORKSPACE/output/ 2>/dev/null || true
          cp -v *nanopi-r1s-h5* $GITHUB_WORKSPACE/output/ 2>/dev/null || true
          cp -v profiles.json config.buildinfo sha256sums version.buildinfo $GITHUB_WORKSPACE/output/ 2>/dev/null || true
          mv -f $GITHUB_WORKSPACE/output-config.seed $GITHUB_WORKSPACE/output/config.seed 2>/dev/null || true
          cp -v $GITHUB_WORKSPACE/openwrt/build.log $GITHUB_WORKSPACE/output/build.log 2>/dev/null || true
          # 写一份刷机说明进产物（须保持 YAML | 块缩进，勿用顶格 heredoc）
          {
            echo "规格：根分区 ${VARIANT_LABEL}（variant=${VARIANT_ID}）"
            echo '推荐首刷：*-squashfs-sdcard.img.gz'
            echo '1) 先解压得到 .img（不要直接刷 .gz）'
            if [ "$VARIANT_ID" = "20g" ]; then
              echo '2) Rufus / balenaEtcher / dd 写入 TF（建议 ≥32GB Class10+）'
              echo '   注意：解压后镜像约 20GB+，刷写时间较长'
            else
              echo '2) Rufus / balenaEtcher / dd 写入 TF（建议 Class10+，≥4GB 即可）'
            fi
            echo '3) 5V/2A 供电，插入 BOOT 卡槽上电'
            echo '4) PWR 亮、STAT 闪烁 = 已启动'
            echo '5) 电脑网线接 LAN(eth1)，打开 http://192.168.5.1'
          } > "$GITHUB_WORKSPACE/output/FLASH.txt"
          {
            echo "ARTIFACT_NAME=iStoreOS-${REPO_BRANCH}-NanoPi-R1S-H5-${VARIANT_ID}"
            echo "RELEASE_TAG=${REPO_BRANCH}-$(date +%Y%m%d)-${GITHUB_RUN_NUMBER}-${VARIANT_ID}"
          } >> $GITHUB_ENV

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: output/*
          if-no-files-found: error
          retention-days: 30

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: iStoreOS ${{ env.REPO_BRANCH }} · NanoPi R1S H5 · ${{ matrix.label }} · ${{ env.RELEASE_TAG }}
          body: |
            iStoreOS `${{ env.REPO_BRANCH }}` 自动编译固件（友善 NanoPi R1S H5 / Allwinner H5）

            - 上游源码：${{ env.REPO_URL }} @ `${{ env.REPO_BRANCH }}` (${{ env.SRC_COMMIT }}, ${{ env.SRC_DATE }})
            - 目标平台：`sunxi` / `cortexa53` · NanoPi R1S H5
            - **根分区**：`${{ matrix.label }}`（`CONFIG_TARGET_ROOTFS_PARTSIZE=${{ matrix.partsize }}`）
            - 软件集：**对齐官方 GL-MT3000（512MB）** — 商店 / QuickStart / 易有云 / DDNSTO / DiskMan / Samba / NFS / CIFS / zram
            - **不含** Docker、OAF、板载 WiFi
            - **推荐刷写**：`*-squashfs-sdcard.img.gz`（先解压成 `.img` 再刷，勿直刷 gz）
            - 20GiB 版请用 **≥32GB** TF；刷写时间较长
            - 供电：5V/2A；PWR 亮 + STAT 闪 = 启动成功
            - 默认：`http://192.168.5.1`（接 LAN/eth1），用户 `root`
          files: output/*
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_unmatched_files: false

      - name: SSH 调试会话
        if: ${{ github.event.inputs.ssh == 'true' && always() }}
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true
